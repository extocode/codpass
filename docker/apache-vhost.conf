<VirtualHost *:80>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php

        # Serve existing files (assets under public/) directly. Send all other requests
        # to the front controller. This is the same behaviour as router.php in the repo.
        FallbackResource /index.php
    </Directory>

    # PHP (the front controllers) serves the application internals. Apache never
    # serves them directly. Deny web access to source, config (DB creds + crypto
    # keys), schemas, tests, the composer vendor tree and docker assets.
    <DirectoryMatch "^/var/www/html/(app|lib|schemas|tests|vendor|resources|docker)/">
        Require all denied
    </DirectoryMatch>

    # Exception: the bundled theme CSS/JS (and the fonts that the CSS references by
    # on-disk path, for example css/Roboto_400.woff2) are in the themes tree.
    # Allow only static asset file types there. PHP views (.inc/.php) stay denied.
    <DirectoryMatch "^/var/www/html/app/modules/web/themes/[^/]+/(css|js)/">
        <FilesMatch "\.(css|js|map|woff2?|ttf|eot|otf|svg|png|jpe?g|gif|ico)$">
            Require all granted
        </FilesMatch>
    </DirectoryMatch>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
