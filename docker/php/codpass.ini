; codPass dev container PHP settings.
; display_errors Off is the same as in production. Thus, the app renders cleanly and
; errors go to the log. The filter removes E_DEPRECATED because the bundled klein/klein
; is not yet PHP 8.4-clean (deprecation notices only). See CONTRIBUTING / tech debt.
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_NOTICE
memory_limit = 256M
date.timezone = UTC
